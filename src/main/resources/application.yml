server:
  port: 8080

spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/yanolja?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: root
    password: 1234
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000
      # Redis 분산 락 설정
      distributed-lock:
        default-timeout: 10 # 기본 락 획득 타임아웃 (초)
        default-lease-time: 30 # 기본 락 보유 시간 (초)
        retry-interval: 100 # 락 획득 재시도 간격 (ms)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH2_GOOGLE_CLIENT_ID}
            client-secret: ${OAUTH2_GOOGLE_CLIENT_SECRET}
            redirect-uri: "${spring.base-url}/login/oauth2/code/google"
            scope:
              - email
              - profile
          kakao:
            client-id: ${OAUTH2_KAKAO_CLIENT_ID}
            client-secret: ${OAUTH2_KAKAO_CLIENT_SECRET}
            redirect-uri: "${spring.base-url}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - profile_image
              - account_email
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  base-url: ${BASE_URL:http://localhost:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
  api-docs:
    path: /api-docs
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

jwt:
  secret: n2r5u8x/A%D*G-KaPdSgVkYp3s6v9y$B&E(H+MbQeThWmZq4t7w!z%C*F-J@NcRf
  access-token-expiration: 900000 # 15분 (밀리초)
  refresh-token-expiration: 1209600000 # 2주 (밀리초)
  header: Authorization
  prefix: "Bearer "

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# 애플리케이션 설정
app:
  retry:
    base-delay: 100 # 기본 재시도 대기 시간 (ms)
    max-delay: 2000 # 최대 재시도 대기 시간 (ms)
    max-attempts: 5 # 기본 최대 재시도 횟수

# PG 결제 설정
payment:
  pg:
    # 토스페이먼츠 설정
    toss:
      api-url: ${TOSS_API_URL:https://api.tosspayments.com}
      client-key: ${TOSS_CLIENT_KEY:test_ck_D5GePWvyJnrK0W0k6q8gLzN97Eoq}
      secret-key: ${TOSS_SECRET_KEY:test_sk_zXLkKEypNArWmo50nX3lmeaxYG5R}
      success-url: ${spring.base-url}/payment/success
      fail-url: ${spring.base-url}/payment/fail
      timeout: 30000 # 30초

    # 카카오페이 설정
    kakao:
      api-url: ${KAKAO_PAY_API_URL:https://kapi.kakao.com}
      cid: ${KAKAO_PAY_CID:TC0ONETIME}
      admin-key: ${KAKAO_PAY_ADMIN_KEY:your_admin_key}
      timeout: 30000 # 30초

    # 네이버페이 설정
    naver:
      api-url: ${NAVER_PAY_API_URL:https://dev.apis.naver.com}
      client-id: ${NAVER_PAY_CLIENT_ID:your_client_id}
      client-secret: ${NAVER_PAY_CLIENT_SECRET:your_client_secret}
      timeout: 30000 # 30초

    # 페이코 설정
    payco:
      api-url: ${PAYCO_API_URL:https://apis.payco.com}
      client-id: ${PAYCO_CLIENT_ID:your_client_id}
      client-secret: ${PAYCO_CLIENT_SECRET:your_client_secret}
      timeout: 30000 # 30초

  # 결제 공통 설정
  common:
    # 결제 완료 후 리다이렉트 URL
    redirect:
      success-url: ${spring.base-url}/payment/success
      fail-url: ${spring.base-url}/payment/fail
      cancel-url: ${spring.base-url}/payment/cancel

    # 결제 관련 시간 설정
    timeout:
      payment: 600000 # 결제 타임아웃 10분 (밀리초)
      approval: 300000 # 승인 타임아웃 5분 (밀리초)

    # 재시도 설정
    retry:
      max-attempts: 3
      delay: 1000 # 1초

    # 웹훅 설정
    webhook:
      secret-key: ${PAYMENT_WEBHOOK_SECRET:your_webhook_secret_key}
      endpoint: ${spring.base-url}/api/v1/payments/webhook

    # 환불 설정
    refund:
      auto-refund-enabled: true
      partial-refund-enabled: true
      refund-fee-rate: 0.01 # 1% 환불 수수료

    # 포인트 적립 설정
    point:
      earning-rate: 0.01 # 1% 적립
      max-earning-per-order: 10000 # 주문당 최대 적립 포인트
      min-order-amount-for-earning: 10000 # 적립 최소 주문 금액

    # 쿠폰 설정
    coupon:
      max-discount-rate: 0.5 # 최대 할인율 50%
      max-discount-amount: 100000 # 최대 할인 금액
      min-order-amount-for-use: 10000 # 쿠폰 사용 최소 주문 금액
